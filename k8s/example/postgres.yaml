# PostgreSQL 17 — one instance, 5Gi PVC (cluster default storageClass, RWO).
apiVersion: v1
kind: Service
metadata:
  name: euta-db
  labels:
    app.kubernetes.io/name: euta-db
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: euta-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: euta-db
  labels:
    app.kubernetes.io/name: euta-db
spec:
  serviceName: euta-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: euta-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: euta-db
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: euta
            - name: POSTGRES_DB
              value: euta
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: euta-cloud-secrets
                  key: POSTGRES_PASSWORD
            # Subdirectory: the volume root holds lost+found and initdb refuses a non-empty directory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "euta", "-d", "euta"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "euta", "-d", "euta"]
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
